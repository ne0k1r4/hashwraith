[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hashwraith"
version = "0.1.0"
description = "A hashcat wrapper that streamlines hash cracking workflows"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Light" }]
keywords = ["hashcat", "password-cracking", "security", "ctf", "pentesting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.scripts]
hashwraith = "hashwraith_pkg:main"

[tool.setuptools]
packages = ["hashwraith_pkg"]
