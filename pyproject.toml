[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hashwraith"
version = "0.2.0"
description = "A hashcat wrapper that streamlines hash cracking workflows"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Light" }]
keywords = ["hashcat", "password-cracking", "security", "ctf", "pentesting", "hash-cracking", "wordlist"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Utilities",
]

[project.urls]
Repository = "https://github.com/ne0k1r4/hashwraith"
Issues = "https://github.com/ne0k1r4/hashwraith/issues"

[project.scripts]
hashwraith = "hashwraith_pkg:cli"

[tool.setuptools]
packages = ["hashwraith_pkg"]
